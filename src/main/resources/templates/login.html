<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Blood Bank</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #1a1d23; --card: #252830; --accent: #c0392b; --accent-hover: #a93226; --text: #ecf0f1; --text-muted: #95a5a6; --border: #34495e; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--card); padding: 40px; border-radius: 16px; width: 100%; max-width: 380px; border: 1px solid var(--border); }
        h1 { margin-bottom: 8px; font-size: 1.5rem; }
        .subtitle { color: var(--text-muted); margin-bottom: 28px; font-size: 0.95rem; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-muted); }
        input { width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1rem; }
        input:focus { outline: none; border-color: var(--accent); }
        .btn { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 8px; }
        .btn:hover { background: var(--accent-hover); }
        .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; }
        .alert-success { background: rgba(39, 174, 96, 0.2); color: #2ecc71; }
        .alert-error { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
        .register-link { text-align: center; margin-top: 24px; }
        .register-link a { color: var(--accent); text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Blood Bank</h1>
        <p class="subtitle">Sign in to continue</p>

        <div th:if="${param.registered}" class="alert alert-success">Registration successful. Please log in.</div>
        <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
        <div th:if="${param.error}" class="alert alert-error">Invalid username or password.</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>

        <p class="register-link">Don't have an account? <a th:href="@{/register}">Register</a></p>
    </div>
</body>
</html>
