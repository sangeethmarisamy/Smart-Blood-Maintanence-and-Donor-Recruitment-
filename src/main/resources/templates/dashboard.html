<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Blood Bank</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1d23;
            --card: #252830;
            --sidebar: #1e2128;
            --accent: #c0392b;
            --accent-hover: #a93226;
            --text: #ecf0f1;
            --text-muted: #95a5a6;
            --border: #34495e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--sidebar);
            padding: 24px 0;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.2s;
        }

        .sidebar a:hover,
        .sidebar a.active {
            color: var(--accent);
            background: rgba(192, 57, 43, 0.1);
        }

        .sidebar .icon {
            width: 20px;
            height: 20px;
            background: var(--border);
            border-radius: 4px;
            opacity: 0.7;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 32px;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .main {
            flex: 1;
            padding: 24px 32px;
            overflow: auto;
        }

        /* Blank monitoring blocks */
        .blocks-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .block {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            min-height: 160px;
        }

        .block-title {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
        }

        .block-content {
            padding: 20px;
            min-height: 100px;
        }

        .block.blank .block-content {
            background: var(--bg);
        }

        .trigger-wrap {
            margin-top: 24px;
        }

        .btn-trigger {
            padding: 14px 28px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-trigger:hover {
            background: var(--accent-hover);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }

        .btn-outline {
            background: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
        }

        form {
            display: inline;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-dialog {
            background: var(--card);
            border-radius: 12px;
            max-width: 520px;
            width: 90%;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .modal-header {
            background: #2980b9;
            color: white;
            padding: 16px 24px;
            font-weight: 600;
            font-size: 1rem;
        }

        .modal-body {
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .modal-body table {
            width: 100%;
            border-collapse: collapse;
        }

        .modal-body th,
        .modal-body td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .modal-body th {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .modal-footer {
            padding: 16px 24px;
            text-align: right;
            border-top: 1px solid var(--border);
        }

        .modal-empty {
            color: var(--text-muted);
            padding: 24px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <a href="/dashboard" class="active"><span class="icon"></span>Dashboard</a>
            <a href="/donors"><span class="icon"></span>Donor List</a>
            <a href="/profile"><span class="icon"></span>Profile</a>
            <form th:action="@{/logout}" method="post" style="margin-top: 24px; padding: 0 24px;">
                <button type="submit" class="btn btn-outline" style="width: 100%;">Logout</button>
            </form>
        </aside>
        <div class="content-area">
            <header class="header">
                <h1>Monitoring Dashboard</h1>
            </header>
            <main class="main">
                <!-- Blank blocks for blood maintenance (not measured yet) -->
                <div class="blocks-grid">
                    <div class="block">
                        <div class="block-title">Blood Stock (Available)</div>
                        <div class="block-content">
                            <div
                                style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center;">
                                <div th:each="stock : ${bloodStocks}"
                                    style="background: var(--bg); padding: 8px; border-radius: 6px;">
                                    <div th:text="${stock.bloodGroup}"
                                        style="font-weight: 700; color: var(--accent); margin-bottom: 4px;"></div>
                                    <div th:text="${stock.availableUnits}" style="font-size: 0.9rem;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="block blank">
                        <div class="block-title">Temperature</div>
                        <div class="block-content"></div>
                    </div>
                    <div class="block blank">
                        <div class="block-title">Weight</div>
                        <div class="block-content"></div>
                    </div>
                    <div class="block" style="grid-column: span 2;">
                        <div class="block-title">Blood Pack Available / Required</div>
                        <div class="block-content" style="padding: 0;">
                            <table style="width: 100%; font-size: 0.9rem;">
                                <thead>
                                    <tr style="background: var(--bg);">
                                        <th style="padding: 8px 20px;">Blood Type</th>
                                        <th style="padding: 8px 20px;">Available</th>
                                        <th style="padding: 8px 20px;">Required</th>
                                        <th style="padding: 8px 20px;">Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="stock : ${bloodStocks}">
                                        <td th:text="${stock.bloodGroup}" style="padding: 8px 20px;"></td>
                                        <td th:text="${stock.availableUnits}" style="padding: 8px 20px;"></td>
                                        <td th:text="${stock.requiredUnits}" style="padding: 8px 20px;"></td>
                                        <td style="padding: 8px 20px;">
                                            <span th:if="${stock.availableUnits >= stock.requiredUnits}"
                                                style="color: #2ecc71;">Sufficient</span>
                                            <span th:if="${stock.availableUnits < stock.requiredUnits}"
                                                style="color: #e74c3c;">Critical</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="trigger-wrap">
                    <button type="button" class="btn-trigger"
                        onclick="document.getElementById('donorModal').classList.add('show')">Weight Limit Reached —
                        Start Donor Recruitment</button>
                </div>

                <!-- Eligible Donors Popup -->
                <div id="donorModal" class="modal-overlay"
                    onclick="if(event.target===this) this.classList.remove('show')">
                    <div class="modal-dialog" onclick="event.stopPropagation()">
                        <div class="modal-header">ELIGIBLE DONORS FOUND</div>
                        <div class="modal-body">
                            <table th:if="${!eligibleDonors.isEmpty()}">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Blood Type</th>
                                        <th>Last Donation Date</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="donor : ${eligibleDonors}">
                                        <td th:text="${donor.name}"></td>
                                        <td th:text="${donor.bloodGroup}"></td>
                                        <td th:text="${donor.lastDonationDate}"></td>
                                    </tr>
                                </tbody>
                            </table>
                            <p th:if="${eligibleDonors.isEmpty()}" class="modal-empty">No eligible donors found.</p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-trigger"
                                onclick="document.getElementById('donorModal').classList.remove('show')">OK</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script>
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') document.getElementById('donorModal').classList.remove('show');
        });
    </script>
</body>

</html>
